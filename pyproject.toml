[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futures-tca"
dynamic = ["version"]
description = "Post-trade TCA for large-tick futures on synthetic order-book data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5"]

[tool.setuptools.dynamic]
version = { attr = "futures_tca.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# "reports" holds generated artifacts from `make report`; not linted.
extend-exclude = ["reports", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
